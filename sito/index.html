<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Famiglia">
<meta name="theme-color" content="#4FB89A">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<title>Famiglia</title>
<style>
:root{--bg:#FFFFFF;--card:#F6F5F1;--ink:#1C1B19;--mute:#5E5B55;--line:#EAE7E0;--soft:#EFEDE7;--arancio:#E07B1F;--arancio-ink:#B4570F;--acc:#4FB89A;--acc2:#E1F5EE;--onacc:#0F1F1A;--acc-testo:#1F6F5C;--warn:#B3261E;--warn2:#FCEBEB;--giallo:#7A4E06;--giallo2:#FAEEDA;--grigio:#B4B2A9;--ff:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--card:#1F1E1B;--arancio:#F0A04B;--arancio-ink:#FAC775;--ink:#F2EFE8;--mute:#A9A49A;--line:#2E2C28;--soft:#2A2925;--acc:#4FB89A;--acc2:#1E3A32;--onacc:#0F1F1A;--acc-testo:#4FB89A;--warn:#FF8A80;--warn2:#3A1F1D;--giallo:#FAC775;--giallo2:#3A2C12;--grigio:#5F5E5A}}
:root[data-theme="dark"]{--bg:#141412;--card:#1F1E1B;--arancio:#F0A04B;--arancio-ink:#FAC775;--ink:#F2EFE8;--mute:#A9A49A;--line:#2E2C28;--soft:#2A2925;--acc:#4FB89A;--acc2:#1E3A32;--onacc:#0F1F1A;--acc-testo:#4FB89A;--warn:#FF8A80;--warn2:#3A1F1D;--giallo:#FAC775;--giallo2:#3A2C12;--grigio:#5F5E5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--ff)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg{flex:none}
.view{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
/* telefono in orizzontale (o schermo largo): il calendario usa tutta la larghezza */
@media (orientation:landscape) and (min-width:640px){#vCal{max-width:1200px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
.top .sub{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.ico{width:40px;height:40px;border-radius:20px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border-radius:20px;padding:4px 16px}
.sez{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sez h2{margin:0;font-size:17px;font-weight:800}
.nota{font-size:13px;color:var(--mute);margin:0 4px}
.vuoto{color:var(--mute);margin:14px 0;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:16px;background:var(--card);font-size:13px;font-weight:700;border:2px solid transparent}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.off{opacity:.45}
.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc-testo)}
.cerca{display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;background:var(--card);padding:0 14px;color:var(--mute);font-size:15px;font-weight:600;width:100%;text-align:left}
.cerca input{border:none;background:transparent;flex:1;font-size:16px;font-weight:600;color:var(--ink);min-width:0;outline:none}
.risdata{font-size:12px;font-weight:800;color:var(--mute);margin:10px 4px 4px}
.risdata::first-letter{text-transform:uppercase}
.consiglio{display:flex;gap:10px;align-items:center;background:var(--acc2);color:var(--acc-testo);border-radius:16px;padding:10px 12px;font-size:13px;font-weight:700}
.consiglio span{flex:1}
.consiglio button{font-weight:800;font-size:13px;color:var(--acc-testo);white-space:nowrap;padding:6px 4px}
.nessuno{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--mute);padding:28px 20px;font-size:14px;font-weight:600}
.nessuno b{color:var(--ink);font-size:16px;font-weight:800}
.avviso{display:flex;gap:10px;align-items:flex-start;background:var(--giallo2);color:var(--giallo);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700}
/* righe impegno */
.ev{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);align-items:stretch}
.ev:last-child{border-bottom:0}
.ev .bar{width:4px;border-radius:2px;background:var(--c);flex:none}
.ev .ora{width:46px;flex:none;font-weight:800;font-size:14px}
.ev .ora small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.ev .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .tx b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ev .tx small{font-size:12px;color:var(--mute);font-weight:600}
.ev .tx .acc{display:flex;align-items:center;gap:4px}
.ev .tx .manca{color:var(--warn);font-weight:800}
.ev.occ .tx b{color:var(--mute)}
/* calendario */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:38px;border-radius:12px;font-weight:800;font-size:13px;color:var(--ink);border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg button:disabled{opacity:.6;cursor:default}
.nav2{display:flex;align-items:center;gap:6px}
.nav2 button{height:36px;min-width:36px;padding:0 10px;border-radius:18px;background:var(--card);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.wk{border:1px solid var(--line);border-radius:20px;padding:10px 6px 8px;overflow:hidden}
.wkh,.wkt{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px}
.wkh button{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding:2px 0 6px;line-height:1.2}
.wkh button b{display:block;font-size:15px;color:var(--ink)}
.wkh button.oggi b{color:var(--onacc);background:var(--acc);border-radius:12px;width:24px;height:24px;line-height:24px;margin:0 auto}
.wkt{border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:2px;min-height:4px}
.wkt div{display:flex;flex-direction:column;gap:2px}
.blk{display:block;width:100%;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,var(--bg));color:color-mix(in srgb,var(--c) 55%,var(--ink));border-left:3px solid var(--c);font-size:10px;font-weight:800;padding:2px 3px;text-align:left;overflow:hidden;white-space:normal;overflow-wrap:anywhere;hyphens:auto;line-height:1.15}
.wkt .blk{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.seg.due{grid-template-columns:repeat(2,1fr);max-width:260px;align-self:center;width:100%}
.seg.due button{height:30px;font-size:12px}
.giornoh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px -4px;font-size:15px;font-weight:800}
.giornoh.oggi{color:var(--acc-testo)}
.libero{font-size:13px;color:var(--mute);margin:0 4px}
.blk.occ{background:transparent;border:1px dashed var(--grigio);color:var(--mute)}
.wkb{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px;position:relative}
.wkb .ore{position:relative}
.wkb .ore span{position:absolute;right:4px;font-size:10px;font-weight:700;color:var(--mute);transform:translateY(-6px)}
.wkb .col{position:relative;border-radius:6px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h))}
.wkb .col.oggi{background-color:color-mix(in srgb,var(--acc) 8%,var(--bg))}
.wkb .col .blk{position:absolute;white-space:normal}
.mese{border:1px solid var(--line);border-radius:20px;padding:10px 8px}
.mese .gr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mese .gr>span{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:4px}
.mese .gr button{min-height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 3px;font-size:14px;font-weight:700}
.mese .gr button.fuori{color:var(--mute);opacity:.5}
.mese .gr button.oggi .n{background:var(--acc);color:var(--onacc);border-radius:12px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.mese .gr button.sel{background:var(--soft)}
.mese .pts{display:flex;flex-direction:column;gap:2px;width:100%;max-width:34px;align-items:stretch}
.mese .pts i{height:4px;border-radius:2px;background:var(--c)}
.mese .pts i.occ{background:var(--grigio)}
.mese .pts em{font-style:normal;font-size:9px;font-weight:800;color:var(--mute);line-height:9px;text-align:center}
.leg{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;margin:0 4px}
.leg i{width:12px;height:9px;border-radius:2px;background:var(--grigio);display:inline-block}
.nuovo{width:42px;height:42px;border-radius:21px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.nav2 .nuovo{height:42px;min-width:42px;padding:0;border-radius:21px;background:var(--acc);margin-left:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.maiusc::first-letter{text-transform:uppercase}
/* volti della famiglia (filtro) */
.volti{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.volti::-webkit-scrollbar{display:none}
.volto{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:52px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.volto .av{width:44px;height:44px;border-radius:22px;background:var(--c);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.volto.acceso .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.volto.spento .av{opacity:.3}
.volto.spento small{opacity:.5}
.volto small{font-size:11px;font-weight:700;color:var(--mute);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.volto .av-tutti{background:var(--soft);color:var(--ink)}
.volto .av-io{background:var(--soft);color:var(--ink);font-size:14px}
.volto.scelto .av-io{background:var(--ink);color:var(--bg)}
/* schede colorate e linea del tempo */
.sc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-radius:16px;padding:10px 12px;background:color-mix(in srgb,var(--c) 15%,var(--bg))}
.sc .facce{display:flex;flex:none}
.sc .facce .av{width:30px;height:30px;border-radius:15px;background:var(--c);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sc .facce .av2{margin-left:-10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 15%,var(--bg))}
.sc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sc b{font-size:15px;font-weight:800;color:color-mix(in srgb,var(--c) 55%,var(--ink));display:flex;align-items:center;gap:5px}
.sc b .ic{display:inline-flex;gap:3px;opacity:.75}
.sc small{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--c) 45%,var(--mute))}
.sc .manca{color:var(--warn);font-weight:800}
.sc .evid{color:var(--arancio-ink);font-weight:800}
.sc.occ{background:transparent;border:1.5px dashed var(--grigio)}
.sc.occ b{color:var(--mute);font-weight:700}
.tuttog{display:flex;flex-direction:column;gap:6px}
.etich{font-size:12px;font-weight:800;color:var(--mute);margin:0 4px}
.tl{position:relative;padding-left:52px}
.tl:before{content:"";position:absolute;left:44px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:1px}
.it{position:relative;padding:4px 0}
.it .h{position:absolute;left:-52px;top:15px;width:36px;text-align:right;font-size:12px;font-weight:800;color:var(--mute)}
.it .pt{position:absolute;left:-13px;top:17px;width:10px;height:10px;border-radius:5px;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.it.conf .pt{width:12px;height:12px;left:-14px;top:16px}
.it.passato .sc{opacity:.5;filter:grayscale(.8)}
.it.passato .h{opacity:.6}
.gruppo{display:flex;flex-direction:column;gap:6px;border-radius:20px;padding:6px;border:1px solid var(--line)}
.gruppo.conflitto{border:3px solid var(--arancio)}
.gruppo .msg{display:flex;align-items:center;gap:6px;color:var(--arancio-ink);font-weight:800;font-size:13px;padding:3px 6px 1px}
.adesso{position:relative;height:18px}
.adesso .h{position:absolute;left:-52px;top:1px;width:36px;text-align:right;font-size:12px;font-weight:800;color:var(--acc-testo)}
.adesso:before{content:"";position:absolute;left:-12px;right:0;top:8px;height:2px;background:var(--acc);border-radius:1px}
.adesso:after{content:"";position:absolute;left:-15px;top:5px;width:8px;height:8px;border-radius:4px;background:var(--acc)}
/* liste */
.voce{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.voce:last-child{border-bottom:0}
.spunta{width:28px;height:28px;border-radius:14px;border:2px solid var(--grigio);flex:none;display:flex;align-items:center;justify-content:center;color:var(--onacc)}
.voce.fatta .spunta{background:var(--acc);border-color:var(--acc)}
.voce .vt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.voce .vt b{font-size:15px;font-weight:700}
.voce .vt small{font-size:12px;color:var(--mute);font-weight:600}
.voce.fatta .vt b{text-decoration:line-through;color:var(--mute)}
.voce .vt small.tardi{color:var(--warn);font-weight:800}
.voce .faccia{width:30px;height:30px;border-radius:15px;background:var(--c);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.voce.fatta .faccia{opacity:.35}
.lista{border:1px solid var(--line);border-radius:20px;padding:2px 14px}
.lista .riga > span{display:flex;align-items:center;gap:10px}
.lista .riga > span:has(small){flex-direction:column;align-items:flex-start;gap:1px}
.lista .riga > span small{margin:0!important;font-size:12px}
.riga .valore{font-size:17px;font-weight:800;color:var(--acc-testo);background:var(--soft);border-radius:10px;padding:4px 10px}
/* benvenuto e come funziona */
.benv{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.benv::-webkit-scrollbar{display:none}
.passo-b{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.passo-b h3{margin:10px 0 0;font-size:24px;font-weight:800;letter-spacing:-.3px;text-wrap:balance}
.passo-b p{margin:0;font-size:16px;line-height:1.5;color:var(--mute)}
.ill{min-height:200px;border-radius:24px;background:color-mix(in srgb,var(--acc) 14%,var(--bg));padding:18px;display:flex;align-items:center;justify-content:center}
.ill.col{flex-direction:column;align-items:stretch;justify-content:center;gap:8px}
.ill .sc{background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.ill .volto{width:56px}
.frase-es{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--mute);align-self:center}
.vis-es{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--mute)}
.vis-es b{color:var(--ink);font-weight:800}
.puntini{display:flex;justify-content:center;gap:6px;margin-top:4px}
.puntini i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.puntini i.on{width:22px;background:var(--acc)}
.faq details{border-bottom:1px solid var(--line);padding:13px 0}
.faq details:last-child{border-bottom:0}
.faq summary{font-size:15px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"›";color:var(--mute);transition:transform .2s}
.faq details[open] summary:after{transform:rotate(90deg)}
.faq details p{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--mute)}
/* rotella ore e minuti */
.ruota{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:200px;margin:4px 0}
.ruota .col{height:200px;width:76px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:80px 0;box-sizing:border-box;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);position:relative;z-index:1}
.ruota .col::-webkit-scrollbar{display:none}
.ruota .col div{height:40px;line-height:40px;text-align:center;font-size:22px;font-weight:700;color:var(--mute);scroll-snap-align:center;cursor:pointer}
.ruota .col div.su{color:var(--ink);font-size:26px;font-weight:800}
.ruota .due-punti{font-size:26px;font-weight:800;z-index:1}
.ruota .lente{position:absolute;left:50%;transform:translateX(-50%);top:80px;height:40px;width:190px;border-radius:12px;background:var(--soft)}
/* membri della famiglia */
.mbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mbs{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 14px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--bg));text-align:center;min-width:0}
.mbs .avg{width:60px;height:60px;border-radius:30px;background:var(--c);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.mbs b{font-size:16px;font-weight:800;color:color-mix(in srgb,var(--c) 55%,var(--ink));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbs b em{font-style:normal;font-weight:600;font-size:13px}
.mbs small{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 45%,var(--mute))}
.mbs .invita{margin-top:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--onacc);background:var(--acc);border-radius:12px;padding:6px 12px}
.sug{border:1px solid var(--line);border-radius:16px;padding:4px;margin-top:-6px;display:flex;flex-direction:column}
.sugr{display:flex;align-items:center}
.sugn{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:12px;font-size:15px;font-weight:700}
.sugn svg{color:var(--acc-testo)}
.sugn:active{background:var(--soft)}
.sugx{width:40px;height:40px;border-radius:20px;color:var(--mute);font-size:20px;flex:none}
.aggiungi{display:flex;gap:8px}
.aggiungi input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);padding:0 14px;font-size:16px}
.aggiungi input:focus{border-color:var(--acc);outline:none}
.aggiungi button{height:48px;width:48px;border-radius:24px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);padding:6px 0}
nav.tabs button.on{color:var(--acc-testo)}
/* membri */
.mb{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.mb:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:19px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.mb .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.mb .tx b{font-size:15px;font-weight:700}
.mb .tx small{font-size:12px;color:var(--mute);font-weight:600}
.pill{font-size:12px;font-weight:800;color:var(--acc-testo);background:var(--acc2);border-radius:12px;padding:6px 10px}
.riga{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;width:100%;text-align:left}
.riga:last-child{border-bottom:0}
.riga.col{flex-direction:column;align-items:stretch;gap:8px}
.riga .lb{color:var(--mute);font-size:13px;font-weight:700}
.riga input,.riga select{border:none;background:transparent;text-align:right;font-weight:700;font-size:16px;min-width:0;flex:1}
.riga input[type=text],.riga input[type=password]{text-align:left}
.riga textarea{border:none;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px;min-height:70px;resize:vertical;width:100%}
.big-in{width:100%;border:none;background:transparent;font-size:20px;font-weight:800;padding:14px 0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:12px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(20px)}
.gsett{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gsett button{height:36px;border-radius:10px;background:var(--soft);font-weight:800;font-size:13px;color:var(--mute)}
.gsett button.on{background:var(--acc2);color:var(--acc-testo)}
.combo .cv{display:flex;align-items:center;gap:12px}
.combo .pal{width:28px;height:28px;border-radius:14px;background:var(--c);flex:none}
.combo #mColLista{max-height:320px;overflow-y:auto;border-top:1px solid var(--line)}
.combo #mColLista .riga{padding:9px 0}
.combo #mColLista small{flex:1;text-align:right;color:var(--mute);font-size:12px;font-weight:600}
.combo .ok{color:var(--acc-testo);font-weight:800;width:16px;text-align:right}
.primary{height:54px;border-radius:18px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:17px;width:100%}
.secondo{height:48px;border-radius:16px;background:var(--card);font-weight:700;width:100%}
.danger{height:48px;border-radius:16px;background:transparent;color:var(--warn);font-weight:700;width:100%}
.err{color:var(--warn);font-weight:700;margin:0 4px;font-size:14px}
.ok{color:var(--acc-testo);font-weight:700;margin:0 4px;font-size:14px}
/* schede a tutto schermo */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;-webkit-overflow-scrolling:touch}
.sheet .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .top h2{margin:0;font-size:17px;font-weight:800;text-align:center;flex:1}
.sheet .top .lnk{font-weight:800;color:var(--acc-testo);font-size:15px;min-width:64px}
.sheet .top .lnk.l{color:var(--mute);text-align:left}
.sheet .top .lnk.r{text-align:right}
.det h3{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.3px}
.det .q{font-size:15px;font-weight:700;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:12px;background:var(--soft);color:var(--mute)}
.accesso .logo{width:72px;height:72px;border-radius:22px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;margin:28px auto 0}
.accesso h2{font-size:26px;font-weight:800;text-align:center;margin:8px 0 0}
.accesso p.nota{text-align:center}
.passi{display:flex;flex-direction:column;gap:12px;padding:14px 0}
.passi h3{margin:0;font-size:14px;font-weight:800;color:var(--mute)}
.passo{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:600}
.passo .n{width:28px;height:28px;border-radius:14px;background:var(--acc2);color:var(--acc-testo);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.passo .ic-in{display:inline-flex;vertical-align:-4px;background:var(--soft);border-radius:6px;padding:2px 4px;margin:0 2px}
.chiave{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:15px;font-weight:600}
.chiave b{font-size:18px;font-weight:800;color:var(--acc-testo)}
.demo{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--giallo2);color:var(--giallo);font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px;z-index:30}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw}
</style>
</head>
<body>

<!-- Accesso -->
<div class="view accesso" id="vAccesso" hidden>
  <div class="logo" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></div>
  <h2 id="aTitolo">Famiglia</h2>
  <p class="nota" id="aNota"></p>
  <div class="card">
    <label class="riga" id="aRigaFam"><span class="lb">Nome della famiglia</span><input type="text" id="aFam" maxlength="40" placeholder="Famiglia Rossi"></label>
    <label class="riga" id="aRigaNome"><span class="lb">Il tuo nome</span><input type="text" id="aNome" autocomplete="given-name" placeholder="Mamma"></label>
    <label class="riga" id="aRigaUser"><span class="lb">Nome utente</span><input type="text" id="aUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="mamma o la tua email"></label>
    <label class="riga"><span class="lb">Password</span><input type="password" id="aPass" autocomplete="current-password" placeholder="almeno 8 caratteri"></label>
  </div>
  <p class="err" id="aErr" role="alert"></p>
  <button class="primary" id="aVai">Entra</button>
  <button class="secondo" id="aCambia"></button>
</div>

<!-- Ultimo passo: dopo invito, nuova famiglia o nuova password aperti nel browser -->
<div class="view accesso" id="vPasso" hidden></div>

<!-- App -->
<div class="view" id="vOggi" hidden></div>
<div class="view" id="vCal" hidden></div>
<div class="view" id="vListe" hidden></div>
<div class="view" id="vFam" hidden></div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="oggi"></button>
  <button data-tab="cal"></button>
  <button data-tab="fam"></button>
</nav>

<div class="sheet" id="sheet" hidden><div class="wrap" id="sheetWrap"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const VERSIONE = '1.0';
const API = 'https://bybshobzuopcfnhrjpvg.supabase.co/functions/v1/api';
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const $ = (id) => document.getElementById(id);
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} } };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Colori dei membri: tutti abbastanza scuri da leggere la lettera bianca sopra
const COLORI = [['#D4537E','Rosa'],['#B0306A','Lampone'],['#D63FB0','Fucsia'],['#D93B3B','Rosso'],['#E8735A','Corallo'],['#E07B1F','Arancio'],
  ['#BA7517','Ambra'],['#B8961A','Senape'],['#8A8F2E','Oliva'],['#639922','Verde prato'],['#2E9D57','Verde'],['#1D9E75','Smeraldo'],
  ['#14A3A3','Verde acqua'],['#1B9CC4','Turchese'],['#378ADD','Azzurro'],['#2F5FC4','Blu'],['#4B4FC9','Indaco'],['#7F77DD','Viola'],
  ['#A27BD9','Lavanda'],['#8E3E8E','Prugna'],['#8B5A3C','Marrone'],['#6B4423','Cioccolato'],['#5B6B7A','Ardesia'],['#888780','Grigio']];
const nomeColore = (hex) => COLORI.find(([c]) => c.toLowerCase() === String(hex).toLowerCase())?.[1] || 'Personalizzato';

// ---------- Icone
const IC = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4 0 4 1.6 4.5 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', sx:'<path d="M15 6l-6 6 6 6"/>', dx:'<path d="M9 6l6 6-6 6"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', car:'<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="13" r=".5"/><circle cx="16.5" cy="13" r=".5"/>',
  bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/>', pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>', rep:'<path d="M4 12a8 8 0 0114-5l2 2M20 12a8 8 0 01-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>',
  flag:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
  cake:'<path d="M4 21h16v-8H4z"/><path d="M4 16c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1 4 0"/><path d="M12 13V9M12 6.5v-.5"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0112 6c5 0 9 6 9 6a17 17 0 01-2.6 3.2M6.6 7.6C4.2 9.3 3 12 3 12s4 6 9 6a9 9 0 004.3-1.1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/>', link:'<path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1"/><path d="M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/>',
};
const ic = (n, s = 20, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${IC[n]}</svg>`;

// ---------- Date ("YYYY-MM-DD", come sul server)
const d2n = (s) => { const [y,m,d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); };
const n2d = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const wd = (n) => ((new Date(n * 864e5).getUTCDay() + 6) % 7) + 1;
const oggi = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); };
const addG = (s, k) => n2d(d2n(s) + k);
const fmt = (s, o) => new Date(d2n(s) * 864e5).toLocaleDateString('it-IT', { timeZone: 'UTC', ...o });
const fmtLungo = (s) => fmt(s, { weekday:'long', day:'numeric', month:'long' });
const mins = (hm) => hm ? Number(hm.slice(0,2)) * 60 + Number(hm.slice(3,5)) : 0;
const GSETT = ['L','M','M','G','V','S','D'];
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
function occorrenze(e, da, a) {
  const out = [];
  const s = d2n(e.giorno), D = d2n(da), A = d2n(a);
  const durata = e.giorno_fine ? Math.max(0, d2n(e.giorno_fine) - s) : 0;
  const fine = e.fino_a ? Math.min(d2n(e.fino_a), A) : A;
  const ecc = new Set(e.eccezioni || []);
  const ok = (n) => n >= s && n + durata >= D && n <= A && !ecc.has(n2d(n));
  if (!e.ripeti) { if (ok(s)) out.push(n2d(s)); return out; }
  const da0 = Math.max(s, D - durata);
  if (e.ripeti === 'giorno' || e.ripeti === 'settimana') {
    const giorni = e.ripeti === 'settimana' ? (e.giorni_sett?.length ? e.giorni_sett : [wd(s)]) : [1,2,3,4,5,6,7];
    for (let n = da0; n <= fine; n++) if (giorni.includes(wd(n)) && ok(n)) out.push(n2d(n));
    return out;
  }
  const [y0, m0, g0] = e.giorno.split('-').map(Number);
  const passo = e.ripeti === 'anno' ? 12 : 1;
  for (let k = 0; k < 2400; k += passo) {
    const y = y0 + Math.floor((m0 - 1 + k) / 12), m = ((m0 - 1 + k) % 12) + 1;
    if (g0 > new Date(Date.UTC(y, m, 0)).getUTCDate()) continue;
    const n = Math.round(Date.UTC(y, m - 1, g0) / 864e5);
    if (n > fine) break;
    if (ok(n)) out.push(n2d(n));
  }
  return out;
}

// ---------- Stato
const KTOKEN = DEMO ? 'famiglia-prova-token' : 'famiglia-token'; // la prova ha un accesso tutto suo
let TOKEN = ls.get(KTOKEN) || '';
let D = null;          // dati dal server: io, utenti, membri, impegni
let TAB = ls.get('famiglia-tab') || 'oggi';
let VISTA = ls.get('famiglia-vista') || 'settimana';
let FORMA = ls.get('famiglia-forma-sett') || 'griglia'; // settimana: griglia o elenco
let GIORNO = oggi();
let NASCOSTI = new Set(JSON.parse(ls.get('famiglia-nascosti') || '[]'));
try { const c = JSON.parse(ls.get('famiglia-dati') || 'null'); if (c && TOKEN) D = c; } catch(e){}

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

async function call(path, body) {
  if (DEMO) return demoCall(path, body);
  let r;
  try {
    r = await fetch(API + path, { method: body ? 'POST' : 'GET', headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  } catch(e) { throw new Error('Nessuna connessione: riprova tra poco.'); }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (r.status === 401 && TOKEN && !['/accedi','/registrati','/reimposta'].includes(path)) { esci(true); throw new Error(j.error || 'Accesso scaduto.'); }
  if (!r.ok) throw new Error(j.error || ('Errore ' + r.status));
  return j;
}

// ---------- Aiuti sui dati
const membro = (id) => D?.membri.find((m) => m.id === Number(id));
const membriAttivi = () => (D?.membri || []).filter((m) => !m.archiviato);
const nomeUtente = (uid) => { const m = D?.membri.find((x) => x.utente_id === uid); return m ? m.nome : (D?.utenti.find((u) => u.id === uid)?.username || ''); };
const puoModificare = (e) => e.mio || e.visibilita === 'condiviso';
const colore = (e) => (!e.mio && e.visibilita === 'occupato') ? 'var(--grigio)' : (membro(e.membri[0])?.colore || 'var(--acc)');
// Visibile se riguarda almeno un membro mostrato, oppure se lo accompagna un membro mostrato
const visibile = (e) => !e.membri.length || e.membri.some((id) => !NASCOSTI.has(id)) || (e.accompagna != null && !NASCOSTI.has(e.accompagna));
const haBambini = (e) => e.membri.some((id) => membro(id)?.tipo === 'bambino');
// Impegni presenti in un giorno (anche quelli di più giorni o che si ripetono)
function delGiorno(g, tutti) {
  const out = [];
  for (const e of D.impegni) {
    if (!tutti && !visibile(e)) continue;
    for (const s of occorrenze(e, g, g)) out.push({ e, s });
  }
  return out.sort((a, b) => (a.e.ora_inizio ? 1 : 0) - (b.e.ora_inizio ? 1 : 0) || (a.s === g ? mins(a.e.ora_inizio) : 0) - (b.s === g ? mins(b.e.ora_inizio) : 0));
}
// Più giorni con orario: il primo giorno "18:00 →", in mezzo "tutto il giorno", l'ultimo "fino alle 20:00"
const durata = (e) => e.giorno_fine ? Math.max(0, d2n(e.giorno_fine) - d2n(e.giorno)) : 0;
const conOrario = (e) => !!e.ora_inizio && !e.giorno_fine; // si disegna nella griglia delle ore
function oraRiga(e, s, g) {
  const ultimo = addG(s, durata(e));
  if (!e.ora_inizio) return `<small>${s === g ? 'tutto il giorno' : 'continua'}</small>`;
  if (!durata(e)) return `${esc(e.ora_inizio)}${e.ora_fine ? `<small>${esc(e.ora_fine)}</small>` : ''}`;
  if (g === s) return `${esc(e.ora_inizio)}<small>→ ${esc(fmt(ultimo, { weekday:'short' }))}</small>`;
  if (g === ultimo) return `<small>fino alle</small>${esc(e.ora_fine || '')}`;
  return '<small>tutto il giorno</small>';
}
function orario(e, s, g) {
  if (!e.ora_inizio) return e.giorno_fine ? 'più giorni' : 'tutto il giorno';
  if (s !== g) return 'continua';
  return e.ora_inizio + (e.ora_fine ? '–' + e.ora_fine : '');
}
function salvaCache() { if (D) ls.set('famiglia-dati', JSON.stringify(D)); }

async function carica() {
  try { D = await call('/dati'); salvaCache(); render(); }
  catch(e) { if (D) render(); toast(e.message); }
}

// ---------- Righe impegno
function rigaEv(e, s, g) {
  const occ = !e.mio && e.visibilita === 'occupato';
  const chi = e.membri.map((id) => membro(id)?.nome).filter(Boolean).join(', ');
  let acc = '';
  if (!occ && e.da_accompagnare) acc = e.accompagna ? `<small class="acc">${ic('car',14)} accompagna ${esc(membro(e.accompagna)?.nome || '')}</small>` : `<small class="acc manca">${ic('car',14)} chi accompagna?</small>`;
  const icons = (e.tipo === 'scadenza' ? ic('flag',14) : e.tipo === 'compleanno' ? ic('cake',14) : '') + (e.visibilita === 'privato' ? ic('lock',14) : '') + (e.visibilita === 'occupato' ? ic('clock',14) : '') + (e.ripeti ? ic('rep',14) : '');
  const oraTx = oraRiga(e, s, g);
  return `<button class="ev${occ ? ' occ' : ''}" style="--c:${colore(e)}" data-ev="${e.id}" data-s="${s}">
    <span class="bar"></span><span class="ora">${oraTx}</span>
    <span class="tx"><b>${esc(e.titolo)} ${icons}</b><small>${esc(chi)}${e.luogo ? ' · ' + esc(e.luogo) : ''}</small>${acc}</span></button>`;
}
function filtroChips(rapidi) {

  const testa = consiglio + (rapidi ? `<div class="chips"><button class="chip" data-rapido="${tutti ? 'nessuno' : 'tutti'}">${tutti ? 'Togli tutti' : 'Seleziona tutti'}</button>${io != null ? `<button class="chip${soloIo ? ' on' : ''}" data-rapido="io">Solo io</button>` : ''}</div>` : '');
  return testa + `<div class="chips">${attivi.map((m) => `<button class="chip${NASCOSTI.has(m.id) ? ' off' : ''}" style="--c:${m.colore}" data-filtro="${m.id}"><span class="dot"></span>${esc(m.nome)}</button>`).join('')}</div>`;

// Avvisi: un adulto con due impegni nello stesso momento
function avvisi(g) {
  const out = [];
  const lista = delGiorno(g, true).filter((x) => conOrario(x.e) && x.s === g);
  for (const a of membriAttivi().filter((m) => m.tipo === 'adulto')) {
    const suoi = lista.filter((x) => x.e.membri.includes(a.id) || x.e.accompagna === a.id)
      .map((x) => ({ t: x.e.titolo, i: mins(x.e.ora_inizio), f: x.e.ora_fine ? mins(x.e.ora_fine) : mins(x.e.ora_inizio) + 60 })).sort((p, q) => p.i - q.i);
    for (let k = 1; k < suoi.length; k++) if (suoi[k].i < suoi[k-1].f) {
      out.push(`${a.nome} ha due impegni insieme: ${suoi[k-1].t} e ${suoi[k].t} (${String(Math.floor(suoi[k].i/60)).padStart(2,'0')}:${String(suoi[k].i%60).padStart(2,'0')})`);
      break;
    }
  }
  return out;
}

// Adulti presenti in due impegni (come membri o come accompagnatori)
const adultiDi = (e) => new Set([...e.membri, e.accompagna].filter((id) => id != null && membro(id)?.tipo === 'adulto'));
const comuni = (a, b) => { const B = adultiDi(b); return [...adultiDi(a)].filter((x) => B.has(x)); };
const nomiDi = (ids) => { const n = ids.map((id) => membro(id)?.nome).filter(Boolean); return n.length > 1 ? n.slice(0, -1).join(', ') + ' e ' + n[n.length - 1] : n[0] || ''; };

// Scheda colorata di un impegno, con il volto della persona
function scheda(e, s, g, evid) {
  const occ = !e.mio && e.visibilita === 'occupato';
  const m0 = membro(e.membri[0]);
  const c = occ ? 'var(--grigio)' : (m0?.colore || 'var(--acc)');
  const facce = e.membri.slice(0, 2).map((id, k) => { const m = membro(id); return m ? `<span class="av${k ? ' av2' : ''}" style="--c:${m.colore}">${esc(m.nome.slice(0,1).toUpperCase())}</span>` : ''; }).join('');
  if (occ) return `<button class="sc occ" data-ev="${e.id}" data-s="${s}"><span class="facce">${facce}</span><span class="tx"><b>${esc(nomiDi(e.membri))} ${e.membri.length > 1 ? 'sono occupati' : 'è occupato'}</b><small>${esc(e.ora_inizio && e.ora_fine && !durata(e) ? e.ora_inizio + '–' + e.ora_fine : '')}</small></span></button>`;
  const parti = [];
  if (durata(e)) parti.push(oraRiga(e, s, g).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
  else if (e.ora_fine) parti.push('fino alle ' + e.ora_fine);
  if (e.membri.length > 1 || !e.membri.length) parti.push(esc(nomiDi(e.membri)));
  if (e.da_accompagnare) parti.push(e.accompagna ? `<span class="${evid?.includes(e.accompagna) ? 'evid' : ''}">porta ${esc(membro(e.accompagna)?.nome || '')}</span>` : '<span class="manca">chi accompagna?</span>');
  if (e.luogo) parti.push(esc(e.luogo));
  const icone = (e.tipo === 'scadenza' ? ic('flag',13) : e.tipo === 'compleanno' ? ic('cake',13) : '') + (e.ripeti ? ic('rep',13) : '') + (e.visibilita === 'privato' ? ic('lock',13) : '') + (e.visibilita === 'occupato' ? ic('clock',13) : '');
  return `<button class="sc" style="--c:${c}" data-ev="${e.id}" data-s="${s}"><span class="facce">${facce}</span>
    <span class="tx"><b>${esc(e.titolo)} <span class="ic">${icone}</span></b>${parti.filter(Boolean).length ? `<small>${parti.filter(Boolean).join(' · ')}</small>` : ''}</span></button>`;
}

// La giornata come linea del tempo: tutto il giorno in cima, poi gli orari; i contemporanei in un riquadro
function lineaDelTempo(g, conOra) {
  const lista = delGiorno(g);
  const tuttoG = lista.filter((x) => !conOrario(x.e) || x.s !== g);
  const items = lista.filter((x) => conOrario(x.e) && x.s === g).map((x) => {
    const i = mins(x.e.ora_inizio);
    return { ...x, i, f: x.e.ora_fine ? Math.max(i + 1, mins(x.e.ora_fine)) : i + 60 };
  }).sort((a, b) => a.i - b.i);
  // gruppi: stessa ora di inizio, oppure sovrapposti con un adulto in comune
  const capo = items.map((_, k) => k);
  const radice = (k) => capo[k] === k ? k : (capo[k] = radice(capo[k]));
  for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) {
    const x = items[a], y = items[b];
    if (x.i === y.i || (x.i < y.f && y.i < x.f && comuni(x.e, y.e).length)) capo[radice(b)] = radice(a);
  }
  const perRadice = new Map();
  items.forEach((it, k) => { const r = radice(k); perRadice.set(r, [...(perRadice.get(r) || []), it]); });
  const gruppi = [...perRadice.values()].sort((p, q) => p[0].i - q[0].i);
  const adesso = new Date(), oraMin = adesso.getHours() * 60 + adesso.getMinutes();
  const hm = (n) => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  let html = '', oraMessa = !conOra;
  const lineaOra = `<div class="adesso"><span class="h">ora</span></div>`;
  for (const gr of gruppi) {
    if (!oraMessa && gr[0].i > oraMin) { html += lineaOra; oraMessa = true; }
    const passato = conOra && gr.every((x) => x.f <= oraMin);
    // adulti con due impegni insieme in questo gruppo
    const doppi = new Set();
    for (let a = 0; a < gr.length; a++) for (let b = a + 1; b < gr.length; b++)
      if (gr[a].i < gr[b].f && gr[b].i < gr[a].f) comuni(gr[a].e, gr[b].e).forEach((id) => doppi.add(id));
    const conflitto = doppi.size > 0, evid = [...doppi];
    const corpo = gr.length === 1
      ? scheda(gr[0].e, gr[0].s, g, evid)
      : `<div class="gruppo${conflitto ? ' conflitto' : ''}">${conflitto ? `<div class="msg">${ic('alert',15)} ${esc(nomiDi(evid))} ${doppi.size > 1 ? 'hanno' : 'ha'} due impegni insieme</div>` : ''}${gr.map((x) => scheda(x.e, x.s, g, evid)).join('')}</div>`;
    const colPt = conflitto ? 'var(--arancio)' : gr.length > 1 ? 'var(--ink)' : (!gr[0].e.mio && gr[0].e.visibilita === 'occupato' ? 'var(--grigio)' : membro(gr[0].e.membri[0])?.colore || 'var(--acc)');
    html += `<div class="it${passato ? ' passato' : ''}${conflitto ? ' conf' : ''}"><span class="h">${hm(gr[0].i)}</span><span class="pt" style="--c:${colPt}"></span>${corpo}</div>`;
  }
  if (!oraMessa && items.length) html += lineaOra;
  return (tuttoG.length ? `<div class="tuttog"><div class="etich">Tutto il giorno</div>${tuttoG.map((x) => scheda(x.e, x.s, g)).join('')}</div>` : '') +
    (items.length ? `<div class="tl">${html}</div>` : '') +
    (!lista.length ? '<p class="vuoto">Niente in programma.</p>' : '');
}

function renderOggi() {
  const g = oggi(), dom = addG(g, 1);

  const testa = `<div class="top"><div><span class="sub">${io ? 'Ciao ' + esc(io.nome) : 'Oggi'}</span><h1 class="maiusc">${esc(fmt(g, { weekday:'long', day:'numeric', month:'long' }))}</h1></div>${btnNuovo()}</div>`;
  if (nessunoSel()) { $('vOggi').innerHTML = testa + volti() + vuotoSel(); return; }
  $('vOggi').innerHTML = `${testa}${volti()}
    ${lineaDelTempo(g, true)}
    <div class="sez"><h2>Domani</h2><span class="nota">${esc(fmt(dom, { weekday:'long', day:'numeric' }))}</span></div>
    ${lineaDelTempo(dom, false)}
    ${daFareOggi(g)}
    ${inArrivo(g)}`;
}
// Cose da fare con una data fino a oggi e non ancora fatte
function daFareOggi(g) {
  const lista = (D.voci || []).filter((v) => v.lista === 'cose' && !v.fatto && v.giorno && v.giorno <= g && (!v.assegnato || !NASCOSTI.has(v.assegnato)));
  if (!lista.length) return '';
  return `<div class="sez"><h2>Da fare</h2><button class="lnk" style="color:var(--acc-testo);font-weight:800;font-size:14px" data-tab-vai="liste">Tutte le liste ›</button></div>
    <div class="lista">${lista.map(rigaVoce).join('')}</div>`;
}
// Scadenze e compleanni dei prossimi 30 giorni (da dopodomani: oggi e domani sono già sopra)
function inArrivo(g) {
  const da = addG(g, 2), a = addG(g, 30), lista = [];
  for (const e of D.impegni) {
    if (!['scadenza', 'compleanno'].includes(e.tipo) || !visibile(e)) continue;
    const s = occorrenze(e, da, a)[0];
    if (s) lista.push({ e, s, n: d2n(s) - d2n(g) });
  }
  if (!lista.length) return '';
  lista.sort((x, y) => x.n - y.n);
  return `<div class="sez"><h2>In arrivo</h2><span class="nota">scadenze e compleanni</span></div>
    <div class="card">${lista.map((x) => `<button class="ev" style="--c:${colore(x.e)}" data-ev="${x.e.id}" data-s="${x.s}"><span class="bar"></span>
      <span class="ora">${x.n}<small>${x.n === 1 ? 'giorno' : 'giorni'}</small></span>
      <span class="tx"><b>${esc(x.e.titolo)} ${ic(x.e.tipo === 'compleanno' ? 'cake' : 'flag', 14)}</b><small>${esc(fmt(x.s, { weekday:'long', day:'numeric', month:'long' }))}</small></span></button>`).join('')}</div>`;
}

// ---------- Schermata Calendario
const lunedi = (g) => n2d(d2n(g) - (wd(d2n(g)) - 1));
function titoloCal() {
  if (VISTA === 'mese') return fmt(GIORNO, { month:'long', year:'numeric' });
  if (VISTA === 'giorno') return fmt(GIORNO, { weekday:'short', day:'numeric', month:'long' });
  const l = lunedi(GIORNO), d = addG(l, 6);
  return fmt(l, { day:'numeric' }) + '–' + fmt(d, { day:'numeric', month:'short' });
}
function renderCal() {
  let corpo = '';
  if (VISTA === 'giorno') corpo = lineaDelTempo(GIORNO, GIORNO === oggi());
  else if (VISTA === 'settimana') corpo = `<div class="seg due">${[['griglia','Griglia'],['elenco','Elenco']].map(([v,t]) => `<button data-forma="${v}" class="${FORMA === v ? 'on' : ''}">${t}</button>`).join('')}</div>` + (FORMA === 'elenco' ? settimanaElenco() : settimana());
  else corpo = mese();
  if (nessunoSel()) corpo = vuotoSel();
  $('vCal').innerHTML = `
    <div class="top"><div><span class="sub">${VISTA === 'giorno' ? 'Giorno' : VISTA === 'settimana' ? 'Settimana' : 'Mese'}</span><h1 class="maiusc">${esc(titoloCal())}</h1></div>
      <div class="nav2"><button data-nav="-1" aria-label="Indietro">${ic('sx',18)}</button><button data-nav="0">Oggi</button><button data-nav="1" aria-label="Avanti">${ic('dx',18)}</button>${btnNuovo()}</div></div>
    ${volti()}
    <div class="seg">${[['giorno','Giorno'],['settimana','Settimana'],['mese','Mese']].map(([v,t]) => `<button data-vista="${v}" class="${VISTA === v ? 'on' : ''}">${t}</button>`).join('')}</div>
    <button class="cerca" id="cApri">${ic('search',18)}<span>Cerca negli impegni</span></button>
    ${corpo}`;
}
// Settimana come elenco: un giorno sotto l'altro, ognuno con la sua linea del tempo
function settimanaElenco() {
  const l = lunedi(GIORNO), g0 = oggi();
  return [...Array(7)].map((_, k) => {
    const g = addG(l, k), lista = delGiorno(g);
    const testa = `<div class="giornoh${g === g0 ? ' oggi' : ''}"><span class="maiusc">${esc(fmt(g, { weekday:'long', day:'numeric' }))}</span>${g === g0 ? '<span>oggi</span>' : ''}</div>`;
    return testa + (lista.length ? lineaDelTempo(g, g === g0) : '<p class="libero">Libero</p>');
  }).join('');
}
function settimana() {
  const l = lunedi(GIORNO), g0 = oggi(), giorni = [...Array(7)].map((_, k) => addG(l, k));
  const H = 42; // altezza di un'ora: c'è posto per 3 righe di titolo
  const evs = giorni.map((g) => delGiorno(g));
  let inizio = 8 * 60, fine = 21 * 60;
  for (let k = 0; k < 7; k++) for (const x of evs[k]) if (conOrario(x.e) && x.s === giorni[k]) {
    inizio = Math.min(inizio, Math.floor(mins(x.e.ora_inizio) / 60) * 60);
    fine = Math.max(fine, Math.ceil((x.e.ora_fine ? mins(x.e.ora_fine) : mins(x.e.ora_inizio) + 60) / 60) * 60);
  }
  fine = Math.min(fine, 24 * 60);
  const px = (m) => (m - inizio) / 60 * H;
  const testa = giorni.map((g, k) => `<button data-giorno="${g}" class="${g === g0 ? 'oggi' : ''}">${GSETT[k]}<b>${Number(g.slice(8))}</b></button>`).join('');
  const tuttoG = giorni.map((g, k) => `<div>${evs[k].filter((x) => !conOrario(x.e) || x.s !== g).map((x) => `<button class="blk${!x.e.mio && x.e.visibilita === 'occupato' ? ' occ' : ''}" style="--c:${colore(x.e)}" data-ev="${x.e.id}" data-s="${x.s}">${x.e.ora_inizio && x.s === g ? esc(x.e.ora_inizio) + ' ' : ''}${esc(x.e.titolo)}</button>`).join('')}</div>`).join('');
  const ore = []; for (let m = inizio; m < fine; m += 60) ore.push(`<span style="top:${px(m)}px">${m / 60}</span>`);
  const colonne = giorni.map((g, k) => {
    const lista = evs[k].filter((x) => conOrario(x.e) && x.s === g).map((x) => ({ x, i: mins(x.e.ora_inizio), f: Math.max(mins(x.e.ora_inizio) + 30, x.e.ora_fine ? mins(x.e.ora_fine) : mins(x.e.ora_inizio) + 60) }));
    // impegni sovrapposti affiancati
    lista.sort((p, q) => p.i - q.i);
    let gruppo = [], corsie = [], fineGr = -1;
    const chiudi = () => { for (const it of gruppo) it.n = corsie.length; gruppo = []; corsie = []; };
    for (const it of lista) {
      if (it.i >= fineGr) chiudi();
      let c = corsie.findIndex((f) => f <= it.i); if (c < 0) { c = corsie.length; corsie.push(0); }
      corsie[c] = it.f; it.c = c; gruppo.push(it); fineGr = Math.max(fineGr, it.f);
    }
    chiudi();
    return `<div class="col${g === g0 ? ' oggi' : ''}" style="height:${px(fine)}px">${lista.map((it) => `<button class="blk${!it.x.e.mio && it.x.e.visibilita === 'occupato' ? ' occ' : ''}" style="--c:${colore(it.x.e)};top:${px(it.i)}px;height:${Math.max(16, px(it.f) - px(it.i) - 2)}px;left:${it.c * 100 / it.n}%;width:${100 / it.n}%" data-ev="${it.x.e.id}" data-s="${it.x.s}">${esc(it.x.e.titolo)}</button>`).join('')}</div>`;
  }).join('');
  return `<div class="wk" style="--h:${H}px"><div class="wkh"><span></span>${testa}</div><div class="wkt"><span></span>${tuttoG}</div>
    <div class="wkb"><div class="ore" style="height:${px(fine)}px">${ore.join('')}</div>${colonne}</div></div>`;
}
function mese() {
  const [y, m] = GIORNO.split('-').map(Number);
  const primo = `${y}-${String(m).padStart(2,'0')}-01`, l = lunedi(primo), g0 = oggi();
  const celle = [];
  const totale = Number(addG(l, 35).slice(5,7)) === m ? 42 : 35; // 5 o 6 settimane
  for (let k = 0; k < totale; k++) {
    const g = addG(l, k);
    const evs = delGiorno(g);
    // fino a 3 trattini colorati (uno per impegno), poi "+n"
    const pts = evs.slice(0, 3).map((x) => `<i class="${!x.e.mio && x.e.visibilita === 'occupato' ? 'occ' : ''}" style="--c:${colore(x.e)}"></i>`).join('') + (evs.length > 3 ? `<em>+${evs.length - 3}</em>` : '');
    celle.push(`<button data-giorno="${g}" class="${Number(g.slice(5,7)) !== m ? 'fuori' : ''}${g === g0 ? ' oggi' : ''}${g === GIORNO ? ' sel' : ''}"><span class="n">${Number(g.slice(8))}</span><span class="pts">${pts}</span></button>`);
  }
  return `<div class="mese"><div class="gr">${GSETT.map((x) => `<span>${x}</span>`).join('')}${celle.join('')}</div></div>
    <div class="sez"><h2 class="maiusc">${esc(fmtLungo(GIORNO))}</h2></div>
    ${lineaDelTempo(GIORNO, GIORNO === g0)}`;
}

const TIPI = { adulto: 'Adulto', bambino: 'Bambino', gruppo: 'Gruppo' };
// I membri come schede colorate con il volto grande; gestione e impostazioni in schermate a parte
function renderFam() {
  const io = D.io;
  const capo = D.utenti.find((u) => u.capo);
  const schede = D.membri.filter((m) => !m.archiviato).map((m) => {

      <b>${esc(m.nome)}${m.id === io.membro ? ' <em>(tu)</em>' : ''}</b><small>${esc(ruolo)}</small>${invita}</button>`;
  }).join('');
  const archiviati = D.membri.filter((m) => m.archiviato);
  $('vFam').innerHTML = `

function aggiungiVoce(testo) {
  let t = String(testo || '').replace(/\s+/g, ' ').trim(); if (!t) return;
  if (LISTA === 'cose') { apriVoce(null, t); return; }

  D.voci = [...(D.voci || []), { ...v, creato_da: D.io.id }];

const maiuscola = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// Memoria di spesa e cose da fare (la stessa che tiene il server)
function ricordaProdotto(nome, lista) {
  const k = nome.toLowerCase();
  const p = (D.prodotti ||= []).find((x) => (x.lista || 'spesa') === lista && x.nome.toLowerCase() === k);
  if (p) { p.volte++; p.nome = nome; } else D.prodotti.push({ nome, volte: 1, lista });

// Suggerimenti: prima quelli che iniziano con quello che scrivi, poi quelli con una parola che inizia così;
// i più usati in cima; non ripropone quelli già in lista e non ancora fatti
function suggerimenti(q) {
  const s = semplice(q).replace(/\s+/g, ' ').trim(); if (!s) return [];
  const gia = new Set(voci(LISTA).filter((v) => !v.fatto).map((v) => semplice(v.testo)));
  return (D.prodotti || []).filter((p) => (p.lista || 'spesa') === LISTA).map((p) => {
    const n = semplice(p.nome);
    const r = n.startsWith(s) ? 0 : n.split(' ').some((w) => w.startsWith(s)) ? 1 : -1;
    return { p, r, n };
  }).filter((x) => x.r >= 0 && !gia.has(x.n) && x.n !== s)
    .sort((a, b) => a.r - b.r || b.p.volte - a.p.volte || a.n.localeCompare(b.n)).slice(0, 6).map((x) => x.p);
}

const PROM = [['', 'Nessuno'], [0, "All'ora dell'impegno"], [10, '10 minuti prima'], [30, '30 minuti prima'], [60, '1 ora prima'], [120, '2 ore prima'], [1440, 'Il giorno prima'],
  [4320, '3 giorni prima'], [10080, '1 settimana prima'], [20160, '2 settimane prima'], [43200, '1 mese prima']];

// ---------- Ricerca negli impegni (titolo, luogo, note e nomi; senza badare ad accenti e maiuscole)
const semplice = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function risultatiRicerca(q) {
  const parole = semplice(q).split(/\s+/).filter(Boolean);
  if (!parole.length) return { prossimi: [], passati: [] };
  const g0 = oggi(), fra1anno = addG(g0, 366), ieri = addG(g0, -1), dueAnniFa = addG(g0, -730);
  const prossimi = [], passati = [];
  for (const e of D.impegni) {
    const testo = semplice([e.titolo, e.luogo, e.note, ...e.membri.map((id) => membro(id)?.nome)].join(' '));
    if (!parole.every((p) => testo.includes(p))) continue;
    const dopo = occorrenze(e, g0, fra1anno)[0];
    if (dopo) { prossimi.push({ e, s: dopo }); continue; }
    const prima = occorrenze(e, dueAnniFa, ieri).pop();
    if (prima) passati.push({ e, s: prima });
  }
  const ora = (x) => mins(x.e.ora_inizio);
  prossimi.sort((a, b) => a.s.localeCompare(b.s) || ora(a) - ora(b));
  passati.sort((a, b) => b.s.localeCompare(a.s) || ora(a) - ora(b));
  return { prossimi: prossimi.slice(0, 40), passati: passati.slice(0, 40) };
}
function apriRicerca(q) {
  apriScheda(`
    <div class="top"><button class="lnk l" id="rChiudi">Chiudi</button><h2>Cerca</h2><span class="lnk"></span></div>
    <label class="cerca">${ic('search',18)}<input id="rQ" type="search" placeholder="Per esempio dentista, Luca, piscina" value="${esc(q)}" autocomplete="off"></label>
    <div id="rRis"></div>`);

  const mostra = () => {
    const q2 = $('rQ').value, g0 = oggi();
    if (!q2.trim()) { $('rRis').innerHTML = '<p class="vuoto">Scrivi una parola del titolo, del luogo, delle note o il nome di una persona.</p>'; return; }
    const r = risultatiRicerca(q2);
    $('rRis').innerHTML = !r.prossimi.length && !r.passati.length ? '<p class="vuoto">Nessun impegno trovato.</p>' :
      (r.prossimi.length ? `<div class="sez"><h2>Prossimi</h2></div>${elenco(r.prossimi, g0)}` : '') +
      (r.passati.length ? `<div class="sez" style="margin-top:14px"><h2>Passati</h2></div>${elenco(r.passati, g0)}` : '');
  };
  $('rQ').oninput = mostra; mostra();

  setTimeout(() => $('rQ').focus(), 50);
}

// ---------- Frase a voce o scritta → impegno («dentista Luca martedì alle 17, accompagna papà»)
const GIORNI_IT = ['lunedi','martedi','mercoledi','giovedi','venerdi','sabato','domenica'];
const MESI_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const PAROLE_VUOTE = new Set(['il','lo','la','i','gli','le','l','un','una','uno','di','del','della','dello','dei','degli','delle','a','al','alla','allo','ai','agli','alle','da','dal','dalla','dai','per','con','e','in','nel','nella','su','sul','alle','ore']);
function interpretaFrase(frase, giornoBase) {
  const O = String(frase).replace(/[,;!?]/g, ' ').trim().split(/\s+/).filter(Boolean);
  const N = O.map((w) => semplice(w).replace(/[^a-z0-9:./]/g, ''));
  const usati = O.map(() => false);
  // cerca un'espressione tra le parole non ancora usate e le segna come usate
  const cerca = (re) => {
    const testo = N.map((w, i) => usati[i] ? '§' : w).join(' ');
    const m = testo.match(re); if (!m) return null;
    const i0 = testo.slice(0, m.index).split(' ').length - 1, n = m[0].split(' ').length;
    for (let i = i0; i < i0 + n && i < usati.length; i++) usati[i] = true;
    return m;
  };
  const c = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const pre = {}, g0 = oggi();
  let m;
  cerca(/^(aggiungi|metti|segna|ricordami|crea|nuovo impegno|nuova)\b/);
  // Tipo
  const tutto = N.join(' ');
  if (/\bcompleanno\b/.test(tutto)) { pre.tipo = 'compleanno'; pre.ripeti = 'anno'; pre.promemoria_min = 10080; }
  else if (/\b(scadenza|scade|bollo|revisione|rinnovo|tagliando)\b/.test(tutto)) { pre.tipo = 'scadenza'; pre.promemoria_min = 10080; }
  // Ripetizione
  if ((m = cerca(/\bogni (lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)\b/))) { pre.ripeti = 'settimana'; pre.giorni_sett = [GIORNI_IT.indexOf(m[1]) + 1]; }
  else if ((m = cerca(/\b(?:ogni|tutti i|tutte le) (giorno|giorni|settimana|settimane|mese|mesi|anno|anni)\b/))) pre.ripeti = { giorno:'giorno', giorni:'giorno', settimana:'settimana', settimane:'settimana', mese:'mese', mesi:'mese', anno:'anno', anni:'anno' }[m[1]];
  // Accompagnamento

const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const urlB64 = (s) => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map((c) => c.charCodeAt(0))); };

async function attivaNotifiche() {

    if (/iPhone|iPad/.test(navigator.userAgent) && !standalone()) throw new Error('Prima aggiungi l\'app alla schermata Home (Condividi › Aggiungi alla schermata Home) e aprila dall\'icona.');
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) throw new Error('Questo telefono non supporta le notifiche (su iPhone serve iOS 16.4 o successivo).');

    if (await Notification.requestPermission() !== 'granted') throw new Error('Notifiche non consentite: attivale dalle impostazioni del telefono.');
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;

// Nome utente: stesso controllo del server (lettere senza accenti, numeri, . _ - @); "" se va bene
function erroreUser(u) {
  if (!u) return 'Scrivi un nome utente.';
  if (u.length < 3) return 'Il nome utente è troppo corto: servono almeno 3 caratteri.';
  if (u.length > 50) return 'Il nome utente è troppo lungo: al massimo 50 caratteri.';
  if (/\s/.test(u)) return 'Il nome utente non può contenere spazi: usa per esempio un punto (ivano.perego).';
  const no = [...u].find((c) => !/[a-z0-9._@-]/.test(c));
  if (no) return `Nel nome utente il carattere «${no}» non è ammesso: usa lettere senza accenti, numeri, punto, trattino, trattino basso o @.`;
  return '';
}
